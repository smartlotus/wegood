<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- WeGood 应用图标 · 向 iOS 健康 App 致敬：暖白底 + 双爱心粉红渐变 -->
  <defs>
    <linearGradient id="frontHeart" x1="2" y1="3" x2="22" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6482"/>
      <stop offset="1" stop-color="#FF2D55"/>
    </linearGradient>
    <linearGradient id="backHeart" x1="2" y1="3" x2="22" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB3C7"/>
      <stop offset="1" stop-color="#FF87A3"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="#FFF6F8"/>
  <!-- 后爱心（浅粉，微旋转） -->
  <g transform="translate(52,30) scale(1.55) rotate(12 12 12)">
    <path d="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z" fill="url(#backHeart)"/>
  </g>
  <!-- 前爱心（粉红渐变 + 白描边） -->
  <g transform="translate(24,30) scale(1.9)">
    <path d="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z" fill="url(#frontHeart)" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
</svg>
